<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Git Tags</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #17324d;
            --muted: #5b7186;
            --accent: #e56b45;
            --paper: #f7f3ed;
            --line: #d9e2e8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-content: center;
            padding: 2rem;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 20%, rgba(229, 107, 69, 0.15), transparent 28%),
                linear-gradient(135deg, #eef4f4 0%, var(--paper) 100%);
            font-family: Georgia, "Times New Roman", serif;
        }

        h1,
        p {
            max-width: 42rem;
            margin-right: auto;
            margin-left: auto;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 1.25rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--line);
            font-size: clamp(2.75rem, 8vw, 5.75rem);
            line-height: 0.95;
            letter-spacing: -0.04em;
        }

        h1::after {
            display: block;
            width: 4.5rem;
            height: 0.35rem;
            margin-top: 1.5rem;
            background: var(--accent);
            content: "";
        }

        p {
            margin-top: 0.75rem;
            margin-bottom: 0;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.6;
        }

        p:first-of-type {
            color: var(--ink);
            font-size: clamp(1.2rem, 3vw, 1.65rem);
        }

        p:nth-of-type(2) {
            margin-top: 3rem;
            padding-top: 1rem;
            border-top: 1px solid var(--line);
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        p:nth-of-type(3) {
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            body {
                padding: 1.5rem;
            }

            h1 {
                font-size: 3.25rem;
            }

            p:nth-of-type(2) {
                margin-top: 2.25rem;
            }
        }
    </style>
</head>

<body>

    <h1>Sistema de Clientes</h1>

    <p>Versão inicial do sistema.</p>

    <p>Autor: Belluxo</p>
    <p>Treinamento github</p>

</body>

</html>
